<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Earthquakes</title>
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <h1>Earthquakes</h1>
  <p>Pick dates and a smallest magnitude to see earthquakes from that time.</p>
  <div id="searchBox">
    <label for="startDate">Start date</label>
    <input type="date" id="startDate">
    <label for="endDate">End date</label>
    <input type="date" id="endDate">
    <label for="minMag">Smallest magnitude</label>
    <input type="number" id="minMag" min="0" max="10" step="0.1">
    <br>
    <button id="searchBtn">Search</button>
  </div>
  <h3 id="validationFdbk"></h3>
  <div id="results"></div>
  <script src="js/script.js"></script>
</body>
</html>
